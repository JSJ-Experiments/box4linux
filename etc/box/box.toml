[core]
selected = "mihomo"
bin_dir = "/usr/bin"
workdir = "/var/lib/box"
config_source = "/etc/box/profiles/phone-mihomo-config.yml"

[network]
mode = "mixed"
tproxy_port = 9898
redir_port = 9797
dns_port = 1053
dns_hijack_mode = "redirect"
dns_enhanced_mode = "fake-ip"
dns_coexist_mode = "preserve_tailnet"
ipv6 = true
# Optional adaptive campus DNS example:
# campus_dns_mode = "auto"
# campus_dns_suffixes = ["+.example.edu"]
# campus_dns_probe_hosts = ["portal.example.edu", "intranet.example.edu"]
# campus_dns_public_servers = [
#   "https://dns.alidns.com/dns-query",
#   "https://cloudflare-dns.com/dns-query",
#   "https://dns.google/dns-query",
# ]
tailscale_iface = "tailscale0"
tailnet_ipv4_cidr = "100.64.0.0/10"
tailnet_ipv6_cidr = "fd7a:115c:a1e0::/48"
tailscale_dns_resolver = "100.100.100.100"
tailscale_fwmark = "0x80000/0xff0000"
tailscale_route_table = 52

[firewall]
backend = "nftables"
route_table = 2024
route_pref = 100
fwmark = "16777216/16777216"
bypass_private_ip = true
bypass_cn_ip = false
bypass_cn_file = "/var/lib/box/china_ipv4.txt"

[policy]
enabled = false
proxy_mode = "core"
debounce_seconds = 3
use_module_on_wifi_disconnect = false
disable_marker = "/run/box/disable"
allow_ifaces = []
ignore_ifaces = []
allow_ssids = []
ignore_ssids = []
allow_bssids = []
ignore_bssids = []

[updater]
artifact_dir = "/var/lib/box/artifacts"
staging_dir = "/var/lib/box/staging"
checksum_policy = "optional"
fetch_retries = 3
fetch_retry_backoff_ms = 750
use_ghproxy = false
ghproxy_url = "https://ghfast.top"
kernel_interval = "daily"
subs_interval = "hourly"
geo_interval = "daily"
dashboard_interval = "weekly"

[updater.kernel]
source = "auto"
release_api_url = ""
release_repo = ""
release_channel = "stable"
release_tag = ""
asset_regex = ""
checksum_asset_regex = ""
release_os = "linux"
release_arch = ""
archive_member_regex = ""
url = ""
file = ""
checksum = ""
checksum_file = ""
target = ""

[updater.subs]
source = "auto"
preset = ""
url = ""
file = ""
checksum = ""
checksum_file = ""
target = "/etc/box/profiles/phone-mihomo-config.yml"
provider_names = []
provider_urls = []
# First-run options:
# 1. Edit /etc/box/profiles/phone-mihomo-config.yml directly and replace
#    <SUBSCRIPTION_URL_...> placeholders with your own provider URLs.
# 2. Or enable updater-driven rendering with:
#    preset = "mihomo_phone"
#    provider_names = ["proxy1"]
#    provider_urls = ["https://example.invalid/subscription"]

[updater.geo]
source = "auto"
preset = "auto"
release_api_url = ""
release_repo = ""
release_channel = "stable"
release_tag = ""
asset_regex = ""
checksum_asset_regex = ""
release_os = "linux"
release_arch = ""
archive_member_regex = ""
url = ""
file = ""
checksum = ""
checksum_file = ""
target = ""

[updater.dashboard]
url = ""
file = ""
checksum = ""
checksum_file = ""
target = "/var/lib/box/dashboard"
