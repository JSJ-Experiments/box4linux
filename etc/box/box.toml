[core]
selected = "mihomo"
bin_dir = "/usr/local/bin"
workdir = "/var/lib/box"
config_source = "/etc/box/profiles/config.yaml"

[network]
mode = "tun"
tproxy_port = 9898
redir_port = 9797
dns_port = 1053
dns_hijack_mode = "tproxy"
dns_coexist_mode = "preserve_tailnet"
tailscale_iface = "tailscale0"
tailnet_ipv4_cidr = "100.64.0.0/10"
tailnet_ipv6_cidr = "fd7a:115c:a1e0::/48"
tailscale_dns_resolver = "100.100.100.100"
tailscale_fwmark = "0x80000/0xff0000"
tailscale_route_table = 52

[firewall]
backend = "iptables"
route_table = 2024
route_pref = 100
fwmark = "16777216/16777216"

[updater]
artifact_dir = "/var/lib/box/artifacts"
staging_dir = "/var/lib/box/staging"
checksum_policy = "optional"
kernel_interval = "daily"
subs_interval = "hourly"
geo_interval = "daily"
dashboard_interval = "weekly"

[updater.kernel]
url = ""
file = ""
checksum = ""
checksum_file = ""
target = ""

[updater.subs]
url = ""
file = ""
checksum = ""
checksum_file = ""
target = ""

[updater.geo]
url = ""
file = ""
checksum = ""
checksum_file = ""
target = ""

[updater.dashboard]
url = ""
file = ""
checksum = ""
checksum_file = ""
target = ""
